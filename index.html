<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rashed AI iPhone Acceptance</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b1020;color:#fff;margin:0;padding:18px}.card{max-width:760px;margin:auto;background:#151c32;padding:18px;border-radius:20px}button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:14px;font-size:17px;font-weight:700;background:#38bdf8;color:#00111a}video{width:100%;background:#000;border-radius:16px;margin:12px 0}.row{padding:11px;border-radius:10px;background:#0b1020;margin:7px 0}.pass{color:#4ade80}.warn{color:#facc15}.fail{color:#fb7185}#meter{height:16px;background:#222;border-radius:10px;overflow:hidden}#level{height:100%;width:0;background:#4ade80}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><div class="card"><h1>Rashed AI — iPhone Acceptance</h1><p>اختبار محلي للكاميرا والمايك وخصائص الزمن الحقيقي. لا يرفع أو يحفظ الصوت أو الفيديو.</p><button id="start">1) ابدأ اختبار الكاميرا والمايك</button><video id="v" autoplay playsinline muted></video><div class="row">الكاميرا: <b id="cam">لم تُختبر</b></div><div class="row">المايك: <b id="mic">لم يُختبر</b></div><div class="row">زمن فتح الأجهزة: <b id="lat">—</b></div><div class="row">Camera FPS: <b id="fps">—</b></div><div class="row">VAD/التقاط الكلام: <b id="vad">—</b></div><div class="row">مستوى الصوت:</div><div id="meter"><div id="level"></div></div><button id="speak">2) اختبار الصوت والمقاطعة</button><div class="row">تشغيل الصوت: <b id="tts">—</b></div><div class="row">المقاطعة بالصوت: <b id="barge">—</b></div><button id="gpu">3) اختبار WebGL / Renderer</button><div class="row">WebGL: <b id="webgl">—</b></div><div class="row">Renderer FPS: <b id="rfps">—</b></div><button id="stop">إيقاف وحذف الـStream</button><pre id="details"></pre></div><script>let stream,ctx,raf,audioRaf,videoRaf,utter,voiceActive=false,bargeArmed=false;const $=id=>document.getElementById(id);function state(id,cls,t){$(id).textContent=t;$(id).className=cls}function ok(id,t='PASS'){state(id,'pass',t)}function warn(id,t){state(id,'warn',t)}function fail(id,t='FAIL'){state(id,'fail',t)}$('start').onclick=async()=>{const t=performance.now();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});$('v').srcObject=stream;$('lat').textContent=Math.round(performance.now()-t)+' ms';const vt=stream.getVideoTracks()[0],at=stream.getAudioTracks()[0];vt?ok('cam'):fail('cam');at?ok('mic'):fail('mic');$('details').textContent='Video: '+(vt?vt.label:'none')+'\nAudio: '+(at?at.label:'none')+'\nSecure context: '+window.isSecureContext;if(vt){let frames=0,start=performance.now(),last=-1;const count=()=>{if($('v').currentTime!==last){last=$('v').currentTime;frames++}const now=performance.now();if(now-start>=3000){const f=frames/((now-start)/1000);$('fps').textContent=f.toFixed(1)+' fps';f>=24?ok('fps',f.toFixed(1)+' fps PASS'):warn('fps',f.toFixed(1)+' fps');}else videoRaf=requestAnimationFrame(count)};count()}if(at){ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=512;src.connect(an);const data=new Uint8Array(an.frequencyBinCount);let speechFrames=0;const tick=()=>{an.getByteFrequencyData(data);let s=0;for(const x of data)s+=x;const avg=s/data.length;$('level').style.width=Math.min(100,avg/1.2)+'%';if(avg>12){speechFrames++;if(speechFrames>=3){ok('vad','PASS');if(bargeArmed&&speechSynthesis.speaking){speechSynthesis.cancel();bargeArmed=false;ok('barge','PASS')}}}else speechFrames=0;audioRaf=requestAnimationFrame(tick)};tick()}}catch(e){fail('cam','BLOCKED');fail('mic','BLOCKED');$('details').textContent=e.name+': '+e.message}};$('speak').onclick=()=>{if(!('speechSynthesis'in window)){fail('tts','UNAVAILABLE');return}speechSynthesis.cancel();utter=new SpeechSynthesisUtterance('هذا اختبار صوت راشد. أثناء سماع هذه الجملة تكلم بصوت واضح لمقاطعتي.');utter.lang='ar-SA';utter.rate=0.9;utter.onstart=()=>{ok('tts','PASS');warn('barge','تكلم الآن للمقاطعة');bargeArmed=true};utter.onend=()=>{if(bargeArmed){warn('barge','لم تُسجّل مقاطعة');bargeArmed=false}};utter.onerror=()=>fail('tts');speechSynthesis.speak(utter)};$('gpu').onclick=()=>{const c=document.createElement('canvas');const gl=c.getContext('webgl2')||c.getContext('webgl');if(!gl){fail('webgl');fail('rfps');return}ok('webgl','PASS');let frames=0,start=performance.now();function draw(){gl.clearColor(Math.random(),0.2,0.4,1);gl.clear(gl.COLOR_BUFFER_BIT);frames++;const now=performance.now();if(now-start<3000)raf=requestAnimationFrame(draw);else{const f=frames/((now-start)/1000);$('rfps').textContent=f.toFixed(1)+' fps';f>=50?ok('rfps',f.toFixed(1)+' fps PASS'):warn('rfps',f.toFixed(1)+' fps')}}draw()};$('stop').onclick=()=>{if(raf)cancelAnimationFrame(raf);if(audioRaf)cancelAnimationFrame(audioRaf);if(videoRaf)cancelAnimationFrame(videoRaf);speechSynthesis.cancel();if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();$('v').srcObject=null;$('details').textContent='Stream stopped. No media retained.'};</script></body></html>
