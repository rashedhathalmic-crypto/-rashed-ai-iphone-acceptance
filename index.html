<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rashed AI iPhone Acceptance</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b1020;color:#fff;margin:0;padding:24px}.card{max-width:700px;margin:auto;background:#151c32;padding:22px;border-radius:20px}button{width:100%;padding:16px;margin:7px 0;border:0;border-radius:14px;font-size:18px;font-weight:700;background:#38bdf8;color:#00111a}video{width:100%;background:#000;border-radius:16px;margin:12px 0}.row{padding:11px;border-radius:10px;background:#0b1020;margin:7px 0}.pass{color:#4ade80}.fail{color:#fb7185}#meter{height:16px;background:#222;border-radius:10px;overflow:hidden}#level{height:100%;width:0;background:#4ade80}</style></head><body><div class="card"><h1>Rashed AI — iPhone Acceptance</h1><p>اختبار محلي للكاميرا والمايك وزمن الوصول. لا يرفع أو يحفظ الفيديو أو الصوت.</p><button id="start">ابدأ اختبار الكاميرا والمايك</button><video id="v" autoplay playsinline muted></video><div class="row">الكاميرا: <b id="cam">لم تُختبر</b></div><div class="row">المايك: <b id="mic">لم يُختبر</b></div><div class="row">زمن فتح الأجهزة: <b id="lat">—</b></div><div class="row">مستوى الصوت:</div><div id="meter"><div id="level"></div></div><button id="stop">إيقاف وحذف الـStream</button><pre id="details"></pre></div><script>let stream,ctx,raf;const $=id=>document.getElementById(id);function state(id,ok,t){$(id).textContent=t;$(id).className=ok?'pass':'fail'}$('start').onclick=async()=>{const t=performance.now();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});$('v').srcObject=stream;$('lat').textContent=Math.round(performance.now()-t)+' ms';const vt=stream.getVideoTracks()[0],at=stream.getAudioTracks()[0];state('cam',!!vt,vt?'PASS':'FAIL');state('mic',!!at,at?'PASS':'FAIL');$('details').textContent='Video: '+(vt?vt.label:'none')+'\nAudio: '+(at?at.label:'none')+'\nSecure context: '+window.isSecureContext;if(at){ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=512;src.connect(an);const data=new Uint8Array(an.frequencyBinCount);const tick=()=>{an.getByteFrequencyData(data);let s=0;for(const x of data)s+=x;$('level').style.width=Math.min(100,s/data.length/1.2)+'%';raf=requestAnimationFrame(tick)};tick()}}catch(e){state('cam',false,'BLOCKED');state('mic',false,'BLOCKED');$('details').textContent=e.name+': '+e.message}};$('stop').onclick=()=>{if(raf)cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();$('v').srcObject=null;$('details').textContent='Stream stopped. No media retained.'};</script></body></html>
